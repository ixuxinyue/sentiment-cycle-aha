name: Update Sentiment Data

on:
  schedule:
    # Run after the A-share close, Beijing Time (UTC+8).
    # The later retry catches data providers that publish end-of-day data slowly.
    - cron: '30 10 * * *' # 18:30 Beijing Time
    - cron: '30 13 * * *' # 21:30 Beijing Time
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run update script
        run: python scripts/update_data.py --fill-missing
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sentiment data"
          file_pattern: 'public/data.json'
