name: Update Sentiment Data

on:
  schedule:
    # Run at 16:10 Beijing Time (UTC+8) = 08:10 UTC.
    # Avoid the top of the hour because scheduled GitHub Actions can be delayed then.
    - cron: '10 8 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run update script
        run: python scripts/update_data.py --fill-missing
        
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sentiment data"
          file_pattern: 'public/data.json'
